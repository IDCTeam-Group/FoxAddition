name: FoxAddition
version: '${version}'
main: zoruafan.foxaddition.FoxAddition
api-version: 1.13
folia-supported: true
authors: ["NovaCraft254 (Zowi)", "swift-dart"]
description: An anti-cheat plugin made with Folia and Geyser support.
website: https://www.idcteam.xyz/
depend: [packetevents]
softdepend: [ProtocolLib, PlaceholderAPI, DiscordSRV, VeinMiner, ExecutableItems, Floodgate]

commands:
  foxaddition:
    description: Main FoxAddition command
    aliases: [fa, foxac, fac]
    usage: /<command> [reload|verbose|version|help]
    permission: foxaddition.command
    permission-message: You don't have permission to use this command.

permissions:
  foxaddition.command:
    description: Access to FoxAddition commands
    default: op
  foxaddition.bypass:
    description: Bypass all anticheat checks
    default: false
    children:
      foxac.bypass.mechanics: true
      foxac.bypass.world: true
      foxac.bypass.badpackets: true
  # Checked in code; undeclared permissions default to op, which made every op bypass all checks.
  foxac.bypass.mechanics:
    description: Bypass the mechanics checks
    default: false
  foxac.bypass.world:
    description: Bypass the world checks
    default: false
  foxac.bypass.badpackets:
    description: Bypass the badpackets checks
    default: false
  foxaddition.alerts:
    description: Receive anticheat alerts
    default: op
  foxaddition.verbose:
    description: Toggle verbose mode
    default: op
